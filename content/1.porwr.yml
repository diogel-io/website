title: Porwr
description: A Nostr signer that lives in your browser's side panel. Your keys never leave the extension.
seo:
  title: Porwr — NIP-07 Nostr Signer for Chrome and Firefox
  description: Porwr is a privacy-first NIP-07 browser extension for Chrome and Firefox. Web apps ask it for signatures, and your private key never leaves its encrypted vault.
hero:
  links:
    - label: Install for Chrome
      to: https://chromewebstore.google.com/detail/diogel/inhkmeiabnknligdjngmoocohdonoboa
      icon: i-simple-icons-google
      color: neutral
      variant: outline
      target: _blank
    - label: Install for Firefox
      to: https://addons.mozilla.org/en-US/firefox/addon/diogel/
      icon: i-simple-icons-firefox
      color: neutral
      variant: outline
      target: _blank
    - label: View Source
      to: https://github.com/diogel-io/porwr
      icon: i-simple-icons-github
      color: neutral
      variant: outline
      target: _blank
  image:
    src: /img/heroes/porwr-hero-1200.webp
    srcset: /img/heroes/porwr-hero-600.webp 600w, /img/heroes/porwr-hero-1200.webp 1200w
    alt: A browser window with a Nostr web page on the left and the Porwr side panel open on the right, showing a sign request with the requesting site, the signing account and an orange approve button
    width: 1200
    height: 900
sections:
  - id: side-panel
    title: Lives in the side panel
    description: Porwr opens in your browser's side panel, beside the page you are using. Approve a request while you read the page that asked for it. Nothing covers your work, and nothing disappears when you click away.
    orientation: horizontal
    image: /img/screenshots/porwr/side-panel.png
    features:
      - title: Approve in context
        description: Read the page and the request side by side
        icon: i-lucide-panel-right
      - title: Queued requests
        description: Several requests at once wait for you in order
        icon: i-lucide-list-ordered
      - title: Requests expire
        description: Between 1 and 10 minutes, 5 by default. There is no "never"
        icon: i-lucide-hourglass
  - id: nip07
    title: Full NIP-07 implementation
    description: Porwr implements the standard window.nostr interface, so any Nostr web app can ask it for signatures. Every request shows who is asking, the account it will sign as, and what the event contains, before you approve.
    orientation: horizontal
    image: /img/screenshots/porwr/nip07-signing-request.png
    reverse: true
    features:
      - title: Event review
        description: Review event details before signing
        icon: i-lucide-eye
      - title: Granular permissions
        description: Per-site, per-account, and per-event-kind permission controls
        icon: i-lucide-settings-2
      - title: One-click actions
        description: Approve or reject, with the site and account always in view
        icon: i-lucide-check-circle
  - id: key-management
    title: Encrypted key management
    description: Your private keys are stored in an encrypted, password-protected vault that lives inside the browser extension. Keys are only decrypted in memory when the vault is unlocked.
    orientation: horizontal
    image: /img/screenshots/porwr/key-management.png
    features:
      - title: AES-GCM encryption
        description: Keys encrypted at rest with password-derived keys
        icon: i-lucide-lock
      - title: Auto-lock
        description: The vault locks after the inactivity time you choose
        icon: i-lucide-timer
      - title: Multiple identities
        description: Import existing keys or generate new ones, and switch between accounts
        icon: i-lucide-users
  - id: privacy
    title: Privacy focused
    description: No analytics. No tracking. No data collection. No remote lookups during an approval, not even a favicon. Fully open source and auditable. Keys never leave the extension.
    orientation: horizontal
    image: /img/screenshots/porwr/connected-sites.png
    reverse: true
    features:
      - title: No data collection
        description: Zero analytics or telemetry
        icon: i-lucide-shield-off
      - title: Nothing sent during approvals
        description: Approving a request makes no network request
        icon: i-lucide-cloud-off
      - title: Local storage only
        description: Keys never leave the extension boundary
        icon: i-lucide-hard-drive
features:
  title: At a glance
  description: Why Porwr is the right choice for browser-based Nostr signing.
  items:
    - title: NIP-07 compliant
      description: Standard window.nostr interface — works with any Nostr web app
      icon: i-lucide-check-check
    - title: Chrome & Firefox
      description: Published on Chrome Web Store and Firefox Add-ons
      icon: i-lucide-globe
    - title: Connected Sites
      description: See which sites hold a permission, and revoke any of them
      icon: i-lucide-key-round
    - title: Relays and wallets
      description: Manage relays and Nostr Wallet Connect (NWC) wallet connections
      icon: i-lucide-radio-tower
    - title: Auto-lock vault
      description: Configurable timeout keeps your keys safe
      icon: i-lucide-timer
    - title: Open source
      description: MIT licensed, auditable, no hidden code
      icon: i-lucide-code-2
cta:
  title: Start signing safely in your browser
  description: Install Porwr and protect your Nostr keys from the web apps that request them.
  links:
    - label: Install for Chrome
      to: https://chromewebstore.google.com/detail/diogel/inhkmeiabnknligdjngmoocohdonoboa
      icon: i-simple-icons-google
      target: _blank
    - label: Install for Firefox
      to: https://addons.mozilla.org/en-US/firefox/addon/diogel/
      icon: i-simple-icons-firefox
      target: _blank
    - label: View Source
      to: https://github.com/diogel-io/porwr
      icon: i-simple-icons-github
      target: _blank
