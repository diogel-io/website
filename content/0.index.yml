title: Your identity. Your voice. No one's permission.
description: "Diogel keeps your Nostr identity in your hands: in your browser, on your mobile, or on a server you run. No single app can take it from you, and Diogel never holds it either."
seo:
  title: Diogel — Own your online identity on Nostr
  description: Your identity. Your voice. No one's permission. Diogel keeps your Nostr identity in your hands, so no single app can take it from you.
hero:
  video:
    mp4: /video/home/hero-v1.mp4
    webm: /video/home/hero-v1.webm
    poster: /video/home/hero-v1-poster.webp
  links:
    - label: Get Started
      to: /docs/getting-started
      icon: i-lucide-rocket
      trailing: true
    - label: View on GitHub
      to: https://github.com/diogel-io
      icon: i-simple-icons-github
      color: neutral
      variant: outline
      target: _blank
sections:
  - id: pillars
    title: Your identity, on your terms
    description: On Nostr, no platform owns your name, your followers or your posts. Diogel keeps your identity safe, so it stays that way.
    orientation: vertical
    features:
      - title: An identity no company can switch off
        description: Your Nostr identity isn't an account a company lends you, so no company can switch it off.
        icon: i-lucide-megaphone
      - title: Take your audience with you
        description: If one app shuts you out, open another and keep your name and your followers.
        icon: i-lucide-door-open
      - title: Own what you publish
        description: Everything you post is signed by you, so it's provably yours.
        icon: i-lucide-badge-check
      - title: No middleman
        description: Your identity stays with you. Not with an app, and not with us.
        icon: i-lucide-user-check
      - title: Only you post as you
        description: Keep your identity out of the apps you try, so none of them can post as you without your permission.
        icon: i-lucide-fingerprint
  - id: protect
    title: How it works
    description: Apps ask Diogel to sign for you. They get a signature, never your key, so none of them holds your identity.
    orientation: horizontal
    video:
      mp4: /video/home/protect-v1.mp4
      webm: /video/home/protect-v1.webm
      poster: /video/home/protect-v1-poster.webp
      label: "Animation: a private key copied into many apps, then kept inside one Diogel boundary in Porwr, Symudol and Bancwr, with apps receiving signatures instead of the key."
    features:
      - title: Browser protection
        description: Porwr keeps your private keys inside the browser extension. Web apps get signatures, not your key.
        icon: i-lucide-shield-check
      - title: Mobile protection
        description: Symudol keeps keys isolated on your Android phone. Signing requests are reviewed before approval.
        icon: i-lucide-smartphone
      - title: Team protection
        description: Bancwr puts governance around shared signing. Team members never see the private key.
        icon: i-lucide-building-2
  - id: sign
    title: Signing is a controlled operation
    description: Signing should be a deliberate act, not an invisible side effect. Requests are reviewed, permissioned, scoped, and logged where useful.
    orientation: horizontal
    video:
      mp4: /video/home/sign-v1.mp4
      webm: /video/home/sign-v1.webm
      poster: /video/home/sign-v1-poster.webp
      label: "Animation: an app asks Diogel for a signature; the request shows the site, account and event; the user approves; a second site must ask separately; permissions are scoped and Bancwr logs signatures."
    features:
      - title: Per-site permissions
        description: Approve or reject signing requests per domain and per event kind. Granular control over what gets signed.
        icon: i-lucide-lock
      - title: Explicit approval flows
        description: 'Nothing is signed without an approval: yours for each request, or a permission you gave that site or app and can revoke at any time.'
        icon: i-lucide-eye
      - title: Signing log
        description: Bancwr keeps a log of recent signatures, so administrators can see what was signed, for which member, and when.
        icon: i-lucide-file-text
  - id: standards
    title: Standards-compatible
    description: Diogel fits the Nostr ecosystem — NIP-07 browser signing, NIP-55 mobile signer flows, and Nostr bunker patterns for remote and team-controlled signing.
    orientation: horizontal
    video:
      mp4: /video/home/standards-v1.mp4
      webm: /video/home/standards-v1.webm
      poster: /video/home/standards-v1-poster.webp
      label: "Animation: NIP-07 web apps through Porwr, NIP-55 Android apps through Symudol and NIP-46 remote signing through Bancwr, all ending in the same signed Nostr event."
    features:
      - title: NIP-07 browser signing
        description: Porwr implements the standard window.nostr interface. Works with any Nostr web app.
        icon: i-lucide-monitor
      - title: NIP-55 mobile signing
        description: Symudol supports modern Android signer flows for app-to-signer requests on mobile.
        icon: i-lucide-smartphone
      - title: Nostr bunker / remote signing
        description: Bancwr aligns with the Nostr bunker pattern for server-side and team-controlled signing.
        icon: i-lucide-server
features:
  title: One suite, three products
  description: "Three products, one promise: your identity stays yours, wherever you use Nostr."
  items:
    - title: Porwr
      description: Use any Nostr web app without handing over your identity.
      icon: i-lucide-shield
      to: /porwr
    - title: Symudol
      description: Carry your Nostr identity on your phone, under your control.
      icon: i-lucide-smartphone
      to: /symudol
    - title: Bancwr
      description: Keep your brand's Nostr identity under your control, on a server you run.
      icon: i-lucide-building-2
      to: /bancwr
cta:
  title: Ready to own your Nostr identity?
  description: "Pick where you use Nostr: Porwr in your browser, Symudol on your mobile, or Bancwr on your own server."
  links:
    - label: Get Started
      to: /docs/getting-started
      icon: i-lucide-arrow-right
      trailing: true
