title: Nostr signing without private-key sprawl
description: Diogel protects Nostr keys, secures signing authority, and lets people, apps, teams, and agents sign safely without taking custody of the private key.
seo:
  title: Diogel — Nostr Key Protection Suite
  description: Protect your Nostr private keys across browser, mobile, and team environments. Sign safely without exposing your keys.
hero:
  links:
    - label: Get Started
      to: /docs/getting-started
      icon: i-lucide-rocket
      trailing: true
    - label: View on GitHub
      to: https://github.com/threenine/diogelwebsite
      icon: i-simple-icons-github
      color: neutral
      variant: outline
      target: _blank
sections:
  - id: protect
    title: Protect your keys
    description: Private keys should not be casually exported to every client. Diogel keeps signing material inside controlled boundaries and returns signatures instead of raw keys.
    orientation: horizontal
    features:
      - title: Browser protection
        description: Porwr keeps your private keys inside the browser extension. Web apps get signatures, not your key.
        icon: i-lucide-shield-check
      - title: Mobile protection
        description: Symudol keeps keys isolated on your Android phone. Signing requests are reviewed before approval.
        icon: i-lucide-smartphone
      - title: Team protection
        description: Bancwr puts governance around shared signing. Team members never see the private key.
        icon: i-lucide-building-2
  - id: sign
    title: Signing is a controlled operation
    description: Signing should be a deliberate act, not an invisible side effect. Requests are reviewed, permissioned, scoped, and logged where useful.
    orientation: horizontal
    reverse: true
    features:
      - title: Per-site permissions
        description: Approve or reject signing requests per domain and per event kind. Granular control over what gets signed.
        icon: i-lucide-lock
      - title: Explicit approval flows
        description: Every signing request is visible. No invisible side effects, no auto-signing without consent.
        icon: i-lucide-eye
      - title: Audit trails
        description: Bancwr provides compliance-oriented audit logs so organisations know exactly what was signed and by whom.
        icon: i-lucide-file-text
  - id: standards
    title: Standards-compatible
    description: Diogel fits the Nostr ecosystem — NIP-07 browser signing, NIP-55 mobile signer flows, and Nostr bunker patterns for remote and team-controlled signing.
    orientation: horizontal
    features:
      - title: NIP-07 browser signing
        description: Porwr implements the standard window.nostr interface. Works with any Nostr web app.
        icon: i-lucide-monitor
      - title: NIP-55 mobile signing
        description: Symudol supports modern Android signer flows for app-to-signer requests on mobile.
        icon: i-lucide-smartphone
      - title: Nostr bunker / remote signing
        description: Bancwr aligns with the Nostr bunker pattern for server-side and team-controlled signing.
        icon: i-lucide-server
features:
  title: One suite, three products
  description: The Diogel suite solves the same problem at three levels — personal browser signing, mobile signing, and organisational key custody.
  items:
    - title: Porwr
      description: Secure Nostr signing for the browser. Web apps get signatures, not your private key.
      icon: i-lucide-shield
      to: /porwr
    - title: Symudol
      description: Dedicated mobile Nostr signing for Android. Approve app requests while keeping keys on-device.
      icon: i-lucide-smartphone
      to: /symudol
    - title: Bancwr
      description: Self-hosted Nostr signing for teams. Shared brand authority without shared private-key chaos.
      icon: i-lucide-building-2
      to: /bancwr
cta:
  title: Ready to protect your Nostr keys?
  description: Get started with Diogel and keep your private keys where they belong — protected.
  links:
    - label: Get Started
      to: /docs/getting-started
      icon: i-lucide-arrow-right
      trailing: true
