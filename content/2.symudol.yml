title: Carry your identity on your phone, under your control.
description: Symudol keeps your Nostr identity on your mobile, so the apps you use never hold it. When an app wants to post as you, it asks Symudol, and you decide. Symudol runs on Android.
seo:
  title: Symudol — Mobile Nostr Signer for Android
  description: Symudol is a dedicated Android Nostr signer that keeps private keys device-local and presents signing requests clearly.
hero:
  headline: Symudol
  links:
    - label: Get it on Zapstore
      to: https://zapstore.dev/apps/io.diogel.symudol
      icon: i-lucide-download
      color: neutral
      variant: outline
      target: _blank
    - label: View Source
      to: https://github.com/diogel-io/symudol
      icon: i-simple-icons-github
      color: neutral
      variant: outline
      target: _blank
  image:
    src: /img/heroes/symudol-hero-1200.webp
    srcset: /img/heroes/symudol-hero-600.webp 600w, /img/heroes/symudol-hero-1200.webp 1200w
    alt: A phone lock screen with the Diogel mark, the account, a fingerprint and a PIN, unlocking the identity that Symudol keeps on the device
    width: 1200
    height: 900
sections:
  - id: mobile-protection
    title: Keys stay on your phone
    description: No copying private keys into random mobile apps. The signer keeps sensitive material isolated on your device.
    orientation: horizontal
    image:
      src: /img/screenshots/symudol/unlock.png
      width: 576
      height: 1280
    features:
      - title: Device-local vault
        description: Private keys are stored securely on the phone
        icon: i-lucide-smartphone
      - title: Multi-identity support
        description: Multiple Nostr accounts managed cleanly
        icon: i-lucide-users
      - title: Focused signer
        description: A dedicated signer, not a bloated everything-app
        icon: i-lucide-crosshair
  - id: approval
    title: Explicit approval flows
    description: You see who is asking and what they want before you approve or reject. Symudol only skips the question when you have already remembered a decision for that app and that kind of request.
    orientation: horizontal
    image:
      src: /img/screenshots/symudol/approval.png
      width: 576
      height: 1280
    reverse: true
    features:
      - title: Clear request UI
        description: Signing requests presented with full context
        icon: i-lucide-eye
      - title: Approve or reject
        description: You decide, unless you have remembered a decision for that request
        icon: i-lucide-hand
      - title: Remembered permissions
        description: Remember a decision for one app and one kind of request, and revoke it in Trusted Nostr apps
        icon: i-lucide-check-circle
  - id: nip55
    title: NIP-55 signer flows
    description: Symudol targets modern NIP-55 signer flows for app-to-signer requests.
    orientation: horizontal
    image:
      src: /img/screenshots/symudol/nip55-request.png
      width: 576
      height: 1280
    features:
      - title: get_public_key
        description: Share your public key with requesting apps
        icon: i-lucide-key-round
      - title: sign_event
        description: Sign Nostr events without exposing the private key
        icon: i-lucide-pen-tool
      - title: NIP-04 & NIP-44
        description: Encrypt and decrypt through the signer boundary
        icon: i-lucide-lock
features:
  title: At a glance
  description: What Symudol brings to mobile Nostr signing.
  items:
    - title: Device-local keys
      description: Private keys never leave your phone
      icon: i-lucide-shield
    - title: NIP-55 flows
      description: Modern app-to-signer flows on Android
      icon: i-lucide-route
    - title: Multi-identity
      description: Switch between Nostr accounts cleanly
      icon: i-lucide-user-circle
    - title: Explicit approvals
      description: Nothing is signed without your approval or a decision you remembered
      icon: i-lucide-hand
    - title: Intent flows
      description: Android intent and ContentResolver signing patterns
      icon: i-lucide-arrow-right-left
    - title: Focused product
      description: Dedicated signer, not a social client or wallet
      icon: i-lucide-crosshair
cta:
  title: Start signing safely on your phone
  description: Install Symudol and keep your Nostr keys out of the apps that ask for them.
  links:
    - label: Get it on Zapstore
      to: https://zapstore.dev/apps/io.diogel.symudol
      icon: i-lucide-download
      target: _blank
    - label: View Source
      to: https://github.com/diogel-io/symudol
      icon: i-simple-icons-github
      target: _blank