title = "Diogel Netlify Configuration File"

[build]
publish = "dist"
command = "pnpm run build"

[dev]
framework = "nuxt"
command = "pnpm run dev" # Command to start your dev server
port = 8000
publish = "dist" # The path to your static content folder
autoLaunch = true # a Boolean value that determines if Netlify Dev launches the local server address in your browser


[build.environment]
NODE_VERSION = "24.7.0"
NODE_OPTIONS = "--max-old-space-size=8192"

# [[redirects]]
#     from = "/*"
#     to = "/index.html"
#     status = 200

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Content-Type = "application/manifest+json"

# Images (#168): names are not versioned, so cache for a day rather than as immutable.
# Netlify clears its own CDN cache on each deploy; this only sets how long browsers keep them.
[[headers]]
for = "/img/*"
[headers.values]
cache-control = "public, max-age=86400"

# Explainer videos (#17): versioned file names, so a new render gets a new name.
[[headers]]
for = "/video/*"
[headers.values]
cache-control = "public, max-age=31536000, immutable"

[[headers]]
for = "/well-known/*"
[headers.values]
Access-Control = "Access-Control-Allow-Origin: *"

[context.branch-deploy]
command = "NODE_OPTIONS=\"--max-old-space-size=8192\" pnpm run build"
